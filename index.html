
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header><h1>Job Application Form</h1></header>
        <form>
            <label for="name">Full Name: </label>
            <input type="text" id="name" placeholder="Enter your name">
            <label for="email">Email: </label>
            <input type="email" id="email" placeholder="Enter your email">
            <label for="position">Position:</label>
            <select id="position">
                <option value="" selected>Select a position</option>
                <option value="teller">Teller</option>
                <option value="banker">Banker</option>
                <option value="advisor">Advisor</option>
            </select>
            <fieldset class="radio-group">
                <legend>Availability: </legend>
                <input 
                type="radio"
                id="full-time"
                name="availability">
                <label for="full-time" class="radio-label">Full-Time</label>
                <input 
                type="radio"
                id="part-time"
                name="availability">
                <label for="part-time" class="radio-label">Part-Time</label>
                </fieldset>
               <label for="message">Why do you want this job?</label> 
            <textarea id="message" placeholder="Write your motivation"></textarea>
            <button type="submit">Submit Application</button>
            </form>
        </div>

</body>
</html>
